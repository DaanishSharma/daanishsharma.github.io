name: Replace root site with portfolio
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: DaanishSharma/resume-spotlight-search
          ref: 413f6b58ef9af2c0834139c48052a3b832c5b768
          persist-credentials: false
      - name: Set root paths and add resume download
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('vite.config.ts')
          p.write_text(p.read_text().replace('process.env[\'GITHUB_ACTIONS\'] === "true" ? "/resume-spotlight-search/" : "/"', '"/"'))
          p=Path('src/test/deployment.test.ts')
          p.write_text(p.read_text().replace('/resume-spotlight-search/', '/').replace('requested repository prefix', 'requested root domain'))
          p=Path('src/routes/index.tsx')
          s=p.read_text().replace('import { Github } from "lucide-react";', 'import { Download, Github } from "lucide-react";\nimport { Button } from "@/components/ui/button";')
          s=s.replace('            Azure Databricks at Tredence.\n          </p>', '            Azure Databricks at Tredence.\n          </p>\n          <Button asChild variant="outline" size="sm" className="mt-6">\n            <a href={`${import.meta.env.BASE_URL}daanish-sharma-resume.pdf`} download>\n              <Download /> Download resume\n            </a>\n          </Button>')
          p.write_text(s)
          p=Path('AGENTS.md')
          p.write_text(p.read_text().replace('under the repository prefix while preview stays at root', 'at the user-site domain root and in preview')+'\n- Serve the compiled resume PDF from public assets with Vite-base-aware links so downloads work on static external hosting.\n')
          Path('roadmap.md').write_text('- [x] Configure root-domain hosting.\n- [x] Add the uploaded resume PDF.\n- [x] Transfer the portfolio to the user-site repository.\n')
          PY
          curl --fail --location 'https://id-preview--7e884f5c-0b32-4ec7-acc6-f422612ba9ae.lovable.app/__l5e/assets-v1/43e738a7-4a7d-4e2c-bd49-fcd9aa3314de/daanish-sharma-resume.pdf' --output public/daanish-sharma-resume.pdf
      - name: Replace main without rewriting history and deploy
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const skip = new Set(['.git', '.lovable', 'node_modules', 'dist', '.output']);
            function files(dir = '.') {
              return fs.readdirSync(dir, {withFileTypes:true}).flatMap(e => {
                if (skip.has(e.name)) return [];
                const p = path.join(dir,e.name);
                return e.isDirectory() ? files(p) : e.isFile() ? [p] : [];
              });
            }
            const tree = [];
            for (const file of files()) {
              const blob = await github.rest.git.createBlob({owner,repo,encoding:'base64',content:fs.readFileSync(file).toString('base64')});
              tree.push({path:file,mode:'100644',type:'blob',sha:blob.data.sha});
            }
            const head = await github.rest.git.getRef({owner,repo,ref:'heads/main'});
            const nextTree = await github.rest.git.createTree({owner,repo,tree});
            const commit = await github.rest.git.createCommit({owner,repo,message:'Replace old site with current portfolio and resume at root domain',tree:nextTree.data.sha,parents:[head.data.object.sha]});
            await github.rest.git.updateRef({owner,repo,ref:'heads/main',sha:commit.data.sha,force:false});
            await github.rest.actions.createWorkflowDispatch({owner,repo,workflow_id:'deploy.yml',ref:'main'});
            core.notice(`New portfolio committed to main: ${commit.data.sha}`);
